name: Python package
on: [push, pull_request]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Add 3.15 once a supporting Qastle release is published.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install .[test]
        python -m pip check
    - name: Lint with flake8
      run: |
        flake8
        flake8 --select=C90 --exit-zero --max-complexity=10
    - name: Test with pytest
      run: |
        python -c "import os, pathlib, shutil, subprocess, sys; target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'installed-uproot-tests'; shutil.copytree('tests', target / 'tests'); sys.exit(subprocess.call([sys.executable, '-m', 'pytest', '-ra', '--rootdir=.', '--cov=func_adl_uproot', '--cov-report=xml:' + str(pathlib.Path.cwd() / 'coverage.xml')], cwd=target))"
    - name: Codecov
      uses: codecov/codecov-action@v1.0.13
